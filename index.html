<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Form</title>

    <!-- FAVICON  -->
    <link rel="shortcut icon" href="" type="image/x-icon" />

    <!-- STYLE  -->
    <link rel="stylesheet" href="assets/style/style.css" />

    <!-- LOADING PERFORMANCE  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- HEADER   -->
    <section class="header" id="header">
      <div class="header__container container grid">
        <h1 class="section__title">Menu Pesanan</h1>
        <p class="header__description">
          Isi form berikut untuk melakukan pemesanan
        </p>
      </div>
    </section>

    <!-- PRODUCTS  -->
    <section class="products" id="products">
      <div class="products__container container grid">
        <h2 class="menu__title">Daftar Menu:</h2>
        <div
          class="products__card"
          data-name="Chicken Teriyaki"
          data-price="35000"
        >
          <img
            src="assets/img/product-1.png"
            alt="image"
            class="products__image"
          />
          <div class="products__info">
            <h3 class="products__title">Chicken Teriyaki</h3>
            <p class="products__price">Rp35.000</p>
          </div>
          <div class="products__qty">
            <span class="decrease__btn">
              <button class="qty__btn qty__minus" aria-label="Decrease">
                -
              </button>
            </span>
            <span class="qty__num">0</span>
            <span class="increase__btn">
              <button class="qty__btn qty__plus" aria-label="Increase">
                +
              </button>
            </span>
          </div>
        </div>
        <div class="products__card" data-name="Beef Bulgogi" data-price="40000">
          <img
            src="assets/img/product-2.png"
            alt="image"
            class="products__image"
          />
          <div class="products__info">
            <h3 class="products__title">Beef Bulgogi</h3>
            <p class="products__price">Rp40.000</p>
          </div>
          <div class="products__qty">
            <span class="decrease__btn">
              <button class="qty__btn qty__minus" aria-label="Decrease">
                -
              </button>
            </span>
            <span class="qty__num">0</span>
            <span class="increase__btn">
              <button class="qty__btn qty__plus" aria-label="Increase">
                +
              </button>
            </span>
          </div>
        </div>
        <div
          class="products__card"
          data-name="Seafood Fried-rice"
          data-price="39000"
        >
          <img
            src="assets/img/product-3.png"
            alt="image"
            class="products__image"
          />
          <div class="products__info">
            <h3 class="products__title">Seafood Fried-rice</h3>
            <p class="products__price">Rp39.000</p>
          </div>
          <div class="products__qty">
            <span class="decrease__btn">
              <button class="qty__btn qty__minus" aria-label="Decrease">
                -
              </button>
            </span>
            <span class="qty__num">0</span>
            <span class="increase__btn">
              <button class="qty__btn qty__plus" aria-label="Increase">
                +
              </button>
            </span>
          </div>
        </div>
      </div>
    </section>
    <section class="customer__data" id="customer-data">
      <div class="customer__data container grid">
        <h2 class="data__title">Isi Data Pemesanan</h2>
        <form action="" class="customer__form" id="order-form">
          <div class="customer__input">
            <input
              type="text"
              name="name"
              id="name"
              required
              aria-label="name"
              placeholder="Nama"
            />
          </div>
          <div class="customer__input">
            <input
              type="tel"
              name="number"
              id="number"
              required
              aria-label="number"
              placeholder="No. Whatsapp"
            />
          </div>
          <div class="customer__input">
            <input
              type="text"
              name="date"
              id="date"
              required
              aria-label="date"
              placeholder="Tanggal Order (contoh: 1 Januari 2026)"
            />
          </div>
          <div class="customer__input">
            <input
              type="text"
              name="address"
              id="address"
              required
              aria-label="address"
              placeholder="Alamat Pengiriman"
            />
          </div>
          <div class="customer__input">
            <input
              type="text"
              name="note"
              id="note"
              required
              aria-label="note"
              placeholder="Catatan"
            />
          </div>
          <button type="submit" class="submit__button">
            Kirim Order ke WhatsApp
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
